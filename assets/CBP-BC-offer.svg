<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1100" viewBox="0 0 900 1100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#86c8be"/>
      <stop offset="48%" stop-color="#5aa8ad"/>
      <stop offset="100%" stop-color="#316f99"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".04"/>
      <stop offset="100%" stop-color="#0b3e5f" stop-opacity=".17"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3.2" cy="3.2" r="2.4" fill="#ffffff" opacity=".95"/>
    </pattern>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0b415d" flood-opacity=".15"/>
    </filter>
  </defs>

  <rect width="900" height="1100" rx="0" fill="url(#bg)"/>
  <rect width="900" height="1100" fill="url(#shade)"/>

  <!-- subtle central certificate motif -->
  <g opacity=".10" stroke="#0f536e" fill="none" stroke-width="6">
    <path d="M450 250 L570 330 L530 515 L450 625 L370 515 L330 330 Z"/>
    <path d="M390 350 H510 V500 H390 Z"/>
    <path d="M420 535 L450 585 L480 535"/>
  </g>

  <!-- dotted top-left decoration -->
  <path d="M0 0 H250 C230 170 175 290 0 340 Z" fill="url(#dots)" opacity=".96"/>

  <!-- discount pill -->
  <g filter="url(#softShadow)">
    <rect x="18" y="18" width="142" height="72" rx="36" fill="#19e8c7"/>
    <text x="89" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#0d5b52">خصم 50%</text>
  </g>

  <!-- Mohteref simple brand mark -->
  <g transform="translate(450 135)" text-anchor="middle">
    <path d="M-52 16 C-32 -5 -12 -7 0 8 C12 -7 32 -5 52 16" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <circle cx="0" cy="-8" r="8" fill="#ffffff"/>
    <text y="54" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">محترف</text>
    <text y="77" font-family="Arial, sans-serif" font-size="16" letter-spacing="7" fill="#ffffff">mohteref</text>
  </g>

  <!-- Arabic title -->
  <g text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-weight="700">
    <text x="450" y="355" font-size="47">شهادة محترف أعمال</text>
    <text x="450" y="435" font-size="47">معتمد</text>
    <text x="450" y="510" font-size="47">في اتصالات الأعمال</text>
  </g>

  <!-- giant code -->
  <text x="450" y="720" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="120" font-weight="800"
        fill="#ffffff">CBP-BC</text>

  <!-- price pill -->
  <g filter="url(#softShadow)">
    <rect x="300" y="805" width="300" height="82" rx="41" fill="#ffffff" fill-opacity=".96"/>
    <text x="450" y="858" text-anchor="middle"
          font-family="Arial, sans-serif" font-size="38" font-weight="800"
          fill="#0c7180">500 ر.س</text>
  </g>

  <text x="450" y="970" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="24" font-weight="700"
        fill="#eaf8f8">اختبار شهادة احترافية</text>
</svg>